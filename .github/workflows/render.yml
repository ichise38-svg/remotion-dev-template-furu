name: Render Remotion Video

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render video
        run: npx remotion render FurusatoComparisonReel out/furusato-comparison-reel.mp4

      - name: Upload video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: furusato-comparison-reel
          path: out/furusato-comparison-reel.mp4
